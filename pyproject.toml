[tool.poetry]
name = "bipl5"
version = "0.1.0"
description = "Create reactive biplots"
authors = ["Ruan Buys"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"
numpy = ">=1.24"
pandas = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
